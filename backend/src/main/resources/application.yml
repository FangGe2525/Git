server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: community-repair
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:community_repair}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
      minimum-idle: 1
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  jwt:
    # 生产环境必须通过 JWT_SECRET 环境变量覆盖，长度不少于 32 字节
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    expire-minutes: ${JWT_EXPIRE_MINUTES:720}

logging:
  level:
    com.community.repair: info
